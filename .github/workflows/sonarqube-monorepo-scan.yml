name: SonarQube Scan

on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:
    inputs:
    branch:
      description: 'Branch to scan'
      required: false
      default: 'main'
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual SonarQube scan'

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_HOST_URL: https://sonarqube.mapup.ai

jobs:
  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

          ref: ${{ github.event.inputs.branch || 'main' }}
      - name: Log manual run reason
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_REASON: ${{ github.event.inputs.reason }}
        run: echo "Manual trigger - $RUN_REASON"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=tollguru-tolltally-api-payload-examples
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**
      - name: Update project sheet tab
        continue-on-error: true
        run: |
          sleep 120
          RESPONSE=$(curl -s -L \
            "${{ secrets.APPS_SCRIPT_WEB_APP_URL }}?project=tollguru-tolltally-api-payload-examples")
          echo "Sheet update response: $RESPONSE"
          if [ "$RESPONSE" = "ok" ]; then
            echo "Sheet updated successfully"
          else
            echo "Sheet update may have failed: $RESPONSE"
          fi
