name: SonarQube Scan

on:
  schedule:
    - cron: '15 3,15 * * *'
  workflow_dispatch:
    inputs:
    branch:
      description: 'Branch to scan'
      required: false
      default: 'main'
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual SonarQube scan'

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SONAR_HOST_URL: https://sonarqube.mapup.ai

jobs:
  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

          ref: ${{ github.event.inputs.branch || 'main' }}
      - name: Log manual run reason
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_REASON: ${{ github.event.inputs.reason }}
        run: echo "Manual trigger - $RUN_REASON"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=tollguru-tolltally-api-payload-examples
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**
      - name: Update project sheet tab
        continue-on-error: true
        run: |
          sleep 120
          RESPONSE=$(curl -s -L \
            "${{ secrets.APPS_SCRIPT_WEB_APP_URL }}?project=tollguru-tolltally-api-payload-examples")
          echo "Sheet update response: $RESPONSE"
          if [ "$RESPONSE" = "ok" ]; then
            echo "Sheet updated successfully"
          else
            echo "Sheet update may have failed: $RESPONSE"
          fi
