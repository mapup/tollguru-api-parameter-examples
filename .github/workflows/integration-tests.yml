name: Integration Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run API integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        env:
          TOLLGURU_API_KEY: ${{ secrets.TOLLGURU_API_KEY }}
          TEST_REPORT_API_URL: https://ctaq0sgn6g.execute-api.us-east-2.amazonaws.com/prod/test-log
          TEST_REPORT_APP_LABEL: ${{ github.repository }}
          TEST_REPORT_ENVIRONMENT: ci
          TEST_REPORT_REPOSITORY: ${{ github.repository }}
        run: python -m pytest tests/ -v --tb=short
